[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.1.0"
description = "A modular, tool-using AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ariadne = "ariadne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

